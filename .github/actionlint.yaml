self-hosted-runner:
  labels:
    # Active default lives in the MACOS_RUNNER_15 / MACOS_RUNNER_DUAL_XCODE /
    # LINUX_RUNNER repo variables; these are the literal labels referenced as
    # fallbacks or as manual workflow_dispatch choices.
    # See docs/ci-runners.md.
    - depot-macos-26
    # Manual workflow_dispatch choices for E2E / perf runs.
    - depot-macos-latest
    - depot-macos-14
    # Break-glass cloud alternative when Depot is down. macOS 26 must not
    # route to warp-macos-26-arm64-6x: our self-hosted minis carry that label,
    # and GitHub prefers a matching self-hosted runner. See
    # check_no_self_hosted_fleet_runners.
    - warp-macos-15-arm64-6x
    # Manual E2E isolated-VM choices only. Required CI remains routed through
    # repo variables.
    - tart-canary
    - tart-dual
    - tart-small
    # Linux: Depot primary (LINUX_RUNNER), WarpBuild overflow fallback. Use
    # depot-ubuntu-24.04-arm-4 if a Linux ARM lane is ever added.
    - depot-ubuntu-24.04
    - depot-ubuntu-24.04-arm-4
    - warp-ubuntu-latest-x64-4x
