name: cmux-tui

on:
  pull_request:
    paths:
      - "cmux-tui/**"
      - ".github/workflows/cmux-tui.yml"
      # The valgrind/test/bindings/windows jobs build libghostty-vt from the
      # ghostty submodule, so a submodule pointer bump must re-run this lane.
      - "ghostty"
      - "scripts/install-zig-ci.sh"
  workflow_dispatch:

concurrency:
  group: cmux-tui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-frontend:
    runs-on: runs-on=${{ github.run_id }}-cmux-tui-web/runner=4cpu-linux-x64/family=c7a+c7i+m7a+m7i/volume=100gb/spot=pco
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: |
            cmux-tui/bindings/typescript/package-lock.json
            cmux-tui/frontends/web/package-lock.json

      - name: Build TypeScript SDK
        working-directory: cmux-tui/bindings/typescript
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build and test web frontend
        working-directory: cmux-tui/frontends/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test

  valgrind-leak-check:
    runs-on: runs-on=${{ github.run_id }}-cmux-tui-valgrind/runner=4cpu-linux-x64/family=c7a+c7i+m7a+m7i/volume=100gb/spot=pco
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Init ghostty submodule
        run: git submodule update --init --depth 1 ghostty

      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Rust version
        run: |
          rustc --version || true
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Build test binaries
        working-directory: cmux-tui
        env:
          # Force libghostty-vt's zig build onto a baseline CPU target so its
          # SIMD codegen stays within what valgrind's instruction emulation
          # supports (see crates/ghostty-vt-sys/build.rs).
          CMUX_GHOSTTY_VT_ZIG_CPU: baseline
        run: |
          mkdir -p target
          cargo test --workspace --locked --no-run --message-format=json > target/cargo-test-binaries.jsonl
          python3 <<'PY'
          import json
          import sys

          # Valgrind checks integration-test binaries. The lib/bin unit harnesses
          # mix hundreds of deadline and scheduling assertions whose wall-clock
          # contracts are invalid under instruction emulation; the complete unit
          # suite keeps running unmodified in `test (linux)` and `test (macos)`.
          # Integration targets retain the protocol, PTY, browser, resource, and
          # SDK lifecycle coverage that can reveal real leaks.
          INTEGRATION_KIND = "test"

          # Throughput/latency benchmarks are not leak-check subjects either:
          # valgrind makes their measured bounds meaningless and their fixed
          # transfer volume dominates this job's budget. The same transport
          # allocation paths stay covered here by direct_ws_e2e, direct_wss_e2e,
          # forward_e2e, multi_client_e2e and pty_reconnect_e2e.
          BENCHMARK_TARGETS = {"interactive_latency_e2e"}

          seen = set()
          skipped = set()
          skipped_unit_harnesses = set()
          with open("target/cargo-test-binaries.jsonl", "r", encoding="utf-8") as messages:
              with open("target/valgrind-test-binaries.txt", "w", encoding="utf-8") as output:
                  for line in messages:
                      try:
                          message = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if not message.get("profile", {}).get("test"):
                          continue
                      executable = message.get("executable")
                      if not executable or executable in seen:
                          continue
                      target = message.get("target", {})
                      name = target.get("name")
                      if INTEGRATION_KIND not in target.get("kind", []):
                          skipped_unit_harnesses.add(name or "<unnamed>")
                          continue
                      if name in BENCHMARK_TARGETS:
                          skipped.add(name)
                          continue
                      seen.add(executable)
                      print(executable, file=output)

          if not seen:
              raise SystemExit("cargo did not report any test binaries")
          missing = BENCHMARK_TARGETS - skipped
          if missing:
              raise SystemExit(f"benchmark exclusion list is stale: {sorted(missing)}")
          print(
              f"Collected {len(seen)} integration test binaries "
              f"(skipped benchmarks: {sorted(skipped)}; "
              f"unit harnesses: {sorted(skipped_unit_harnesses)})",
              file=sys.stderr,
          )
          PY

      - name: Run test binaries under valgrind
        working-directory: cmux-tui
        env:
          # Valgrind's ~30x slowdown breaks the 50ms ws-latency budget on an
          # otherwise-correct build; the guarded regression (events serialized
          # behind a 100ms read poll) inflates far past this bound anyway.
          CMUX_TEST_WS_LATENCY_BUDGET_MS: "2000"
          # Process-exit and PTY-reader tests also use bounded polling. Keep
          # their normal deadlines strict while allowing for instrumentation.
          CMUX_TEST_TIMEOUT_SCALE: "4"
        run: |
          while IFS= read -r bin; do
            [ -n "$bin" ] || continue
            echo "Running valgrind for $bin"
            # Valgrind serializes guest execution; a parallel Rust harness can
            # otherwise starve socket/event worker threads past their deadlines.
            if ! valgrind \
              --error-exitcode=1 \
              --leak-check=full \
              --show-leak-kinds=definite \
              --errors-for-leak-kinds=definite \
              --track-origins=yes \
              --suppressions=ci/valgrind.supp \
              -- "$bin" --test-threads=1; then
              echo "Valgrind failed for $bin" >&2
              exit 1
            fi
          done < target/valgrind-test-binaries.txt

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos' && 'tartelet' || format('runs-on={0}-cmux-tui-test-{1}/runner=4cpu-linux-x64/family=c7a+c7i+m7a+m7i/volume=100gb/spot=pco', github.run_id, matrix.os) }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos, linux]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Init ghostty submodule
        run: git submodule update --init --depth 1 ghostty

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Rust version
        run: |
          rustc --version || true
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: cargo fmt
        working-directory: cmux-tui
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: cmux-tui
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: cmux-tui
        run: cargo test --workspace --locked

      - name: crossterm parser tests
        working-directory: cmux-tui
        # Crossterm's vendored color tests mutate process-global NO_COLOR and
        # its memoized color flag, so the library suite is not parallel-safe.
        run: cargo test --manifest-path vendor/crossterm/Cargo.toml --lib -- --test-threads=1

      - name: TUI smoke test (scripted pty)
        working-directory: cmux-tui
        run: |
          cargo build -p cmux-tui
          python3 scripts/smoke-tui.py

      # The attach smoke is temporarily opt-in: at the merged upstream pin an
      # attached client can enter a redraw livelock (an identical cursor-park
      # frame repeated forever) that saturates this repo's CI runners
      # and fails the first-attach echo assertion; upstream's faster hosted
      # runners absorb it and their CI is green over the same runtime. The
      # renderer fix-train landed upstream post-pin and arrives at the next
      # sync — set the repo variable CMUX_TUI_SMOKE_ENABLED=true then.
      # Evidence and history: .superpowers/sdd/task-11b-report.md (round 9).
      - name: Detach/reattach smoke test
        if: ${{ vars.CMUX_TUI_SMOKE_ENABLED == 'true' }}
        working-directory: cmux-tui
        run: python3 scripts/smoke-attach.py

      - name: Detach/reattach smoke skip notice
        if: ${{ vars.CMUX_TUI_SMOKE_ENABLED != 'true' }}
        run: |
          echo "::notice::attach smoke skipped: pin-era redraw livelock saturates CI runners; re-enable by setting repo variable CMUX_TUI_SMOKE_ENABLED=true after the next upstream sync brings the post-pin renderer fix-train (documented in task-11b-report round 9)"

  bindings-e2e:
    runs-on: runs-on=${{ github.run_id }}-cmux-tui-bindings/runner=4cpu-linux-x64/family=c7a+c7i+m7a+m7i/volume=100gb/spot=pco
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Init ghostty submodule
        run: git submodule update --init --depth 1 ghostty

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Rust version
        run: |
          rustc --version || true
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Java version
        run: |
          echo "JAVA_HOME_17_X64=$JAVA_HOME_17_X64"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          export PATH="$JAVA_HOME_17_X64/bin:$PATH"
          java -version
          javac -version

      - name: Build cmux-tui server
        working-directory: cmux-tui
        run: cargo build -p cmux-tui

      - name: Install TypeScript binding dependencies
        # The conformance runner and e2e.sh build the TypeScript SDK with
        # `npm run build`; install its pinned devDependencies (typescript,
        # @types/node) instead of relying on whatever global toolchain the
        # runner image happens to carry.
        working-directory: cmux-tui/bindings/typescript
        run: npm ci --no-audit --no-fund

      - name: Install zig for SDK conformance adapters
        # The Zig SDK and its conformance adapters target Zig 0.15.2 (see
        # bindings/conformance/README.md and cmux-tui-sdks.yml), while the
        # ghostty-derived toolchain installed above serves the cmux-tui server
        # build, which runs before this step. This publishes the SDK compiler
        # on PATH and as CMUX_ZIG for the conformance steps below.
        run: >-
          ZIG_REQUIRED=0.15.2
          ZIG_FORCE_LOCAL_INSTALL=1
          ZIG_INSTALL_ROOT="$RUNNER_TEMP/zig-sdk-conformance"
          ./scripts/install-zig-ci.sh

      - name: Python conformance fixtures
        run: python3 cmux-tui/bindings/conformance/runner.py

      - name: Binding e2e
        run: bash cmux-tui/bindings/conformance/e2e.sh --require python,typescript,rust,go,java

  windows-experimental:
    name: windows experimental (x86_64-gnu)
    runs-on: windows-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Init ghostty submodule
        run: git submodule update --init --depth 1 ghostty

      - name: Resolve Ghostty Zig version
        id: ghostty-zig-version
        shell: bash
        run: |
          version="$(bash ./scripts/ghostty-zig-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install zig
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: ${{ steps.ghostty-zig-version.outputs.version }}

      - name: Install Rust GNU target
        shell: bash
        run: |
          rustup target add x86_64-pc-windows-gnu
          printf '%s\n' 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"

      - name: Build libghostty-vt for Windows GNU
        shell: bash
        working-directory: ghostty
        run: |
          zig build -Demit-lib-vt=true -Demit-xcframework=false -Doptimize=ReleaseFast -Dtarget=x86_64-windows-gnu --prefix "$RUNNER_TEMP/ghostty-vt-win-gnu"
          zig ar t "$RUNNER_TEMP/ghostty-vt-win-gnu/lib/ghostty-vt-static.lib" | head

      - name: cargo build cmux-tui for Windows GNU
        working-directory: cmux-tui
        run: cargo build -p cmux-tui --target x86_64-pc-windows-gnu --locked
