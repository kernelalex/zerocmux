  tests:
    name: tests
    # Aggregate gate for the test/build suites in this workflow. Required by
    # branch protection under the stable name "tests", and references each suite
    # by its job KEY via needs:, so renaming/sharding a job's display name never
    # desyncs the required-checks list (the failure mode from the #6464 sharding
    # that stranded the old "tests" check). Add new ci.yml test/build jobs here.
    needs:
      - changes
      - linux-preflight
      - app-host-unit-tests
      - swift-package-tests
      - agent-session-web-resources
    if: ${{ always() }}
    runs-on: runs-on=${{ github.run_id }}-tests/runner=4cpu-linux-x64/family=c7a+c7i+m7a+m7i/volume=100gb/spot=pco
    timeout-minutes: 5
    steps:
      - name: Check app-host unit test routing
        env:
          TESTS_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["TESTS_NEEDS"])
          changes = needs["changes"]
          tests = needs["app-host-unit-tests"]
          macos = changes.get("outputs", {}).get("macos")

          if changes["result"] != "success":
              print(f"changes: {changes['result']}", file=sys.stderr)
              sys.exit(1)

          preflight = needs["linux-preflight"]
          if preflight["result"] != "success":
              print(f"linux preflight did not pass: {preflight['result']}", file=sys.stderr)
              sys.exit(1)

          if macos == "true" and tests["result"] != "success":
              print(f"app-host unit tests were required but did not pass: {tests['result']}", file=sys.stderr)
              sys.exit(1)

          if macos != "true" and tests["result"] not in {"success", "skipped"}:
              print(f"app-host unit tests had unexpected result for macos={macos}: {tests['result']}", file=sys.stderr)
              sys.exit(1)

          # The remaining test/build suites in this workflow gate too. A job that
          # opts out via its own path filter reports "skipped", which is fine; a
          # job that actually ran and failed must block the merge.
          allowed = {"success", "skipped"}
          for name in ("swift-package-tests", "agent-session-web-resources"):
              result = needs[name]["result"]
              if result not in allowed:
                  print(f"{name} did not pass: {result}", file=sys.stderr)
                  sys.exit(1)

          print(f"changes.macos={macos}")
          print(f"linux-preflight={preflight['result']}")
          print(f"app-host unit tests={tests['result']}")
          for name in ("swift-package-tests", "agent-session-web-resources"):
              print(f"{name}={needs[name]['result']}")
          PY

  swift-package-tests:
    needs:
      - changes
      - linux-preflight
    # !cancelled() disables the implicit success() gate, which GitHub evaluates
    # over the transitive needs chain: linux-preflight runs behind routed linux
    # jobs that legitimately skip (web/go/agent-session paths), and that
    # transitive skip otherwise marks every macOS job skipped even when
    # linux-preflight itself succeeds. Require the direct needs explicitly.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.linux-preflight.result == 'success' && needs.changes.outputs.macos == 'true' }}
    # Build the release helper and the package tests with the lane's default
    # Xcode. The old dual-Xcode SDK-15 helper pin existed for zig 0.15.2's
    # MachO linker; zig 0.16 links against current SDKs, and the helper's
    # macOS support floor is asserted via LC_BUILD_VERSION minos below.
    runs-on: tartelet
    # A hung Remote* suite costs one 5-minute alarm + retry; leave headroom.
    timeout-minutes: 40
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Cache Zig packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/zig
          key: zig-packages-${{ hashFiles('ghostty/build.zig.zon', 'ghostty/build.zig.zon.json') }}
          restore-keys: zig-packages-

      - name: Build universal Ghostty CLI helper
        run: |
          set -euo pipefail
          mkdir -p ghostty-cli-helper
          ./scripts/build-ghostty-cli-helper.sh --universal --output ghostty-cli-helper/ghostty
          lipo ghostty-cli-helper/ghostty -verify_arch arm64 x86_64
          for arch in arm64 x86_64; do
            thin="ghostty-cli-helper/ghostty-$arch"
            lipo ghostty-cli-helper/ghostty -thin "$arch" -output "$thin"
            HELPER_SDK_VERSION="$(otool -l "$thin" | awk '/LC_BUILD_VERSION/ { in_version=1; next } in_version && /sdk / { print $2; exit }')"
            HELPER_MINOS="$(otool -l "$thin" | awk '/LC_BUILD_VERSION/ { in_version=1; next } in_version && /minos / { print $2; exit }')"
            echo "Ghostty helper $arch minos: $HELPER_MINOS (SDK $HELPER_SDK_VERSION)"
            # The SDK follows the lane's Xcode; what must never regress is the
            # helper's macOS support floor.
            [[ "$HELPER_MINOS" == 13.* ]]
          done

      - name: Upload universal Ghostty CLI helper
        id: upload-ghostty-cli-helper
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zerocmux-ghostty-cli-helper
          path: ghostty-cli-helper/ghostty
          if-no-files-found: error

      - name: Retry universal Ghostty CLI helper upload
        if: steps.upload-ghostty-cli-helper.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zerocmux-ghostty-cli-helper
          path: ghostty-cli-helper/ghostty
          if-no-files-found: error
          overwrite: true

      - name: Capture Ghostty revision
        id: ghostty-revision
        run: |
          echo "sha=$(git -C ghostty rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit.xcframework
        id: cache-ghosttykit-package-tests
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: GhosttyKit.xcframework
          key: ghosttykit-sentry-off-v1-${{ steps.ghostty-revision.outputs.sha }}

      - name: Validate cached GhosttyKit.xcframework
        id: validate-ghosttykit-package-tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -f GhosttyKit.xcframework/Info.plist ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            rm -rf GhosttyKit.xcframework
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pre-built GhosttyKit.xcframework
        if: steps.validate-ghosttykit-package-tests.outputs.valid != 'true'
        run: |
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Install Rust
        run: |
          ./scripts/install-rust-ci.sh

      - name: Run Swift package unit tests
        run: |
          set -euo pipefail
          # CmuxCommandPalette's nucleo FFI tests load the Rust dylib through
          # CMUX_NUCLEO_FFI_LIB (they skip when it is absent, so build it here
          # to keep the FFI parity suite a real gate).
          cargo build --manifest-path Native/CommandPaletteNucleoFFI/Cargo.toml --release
          export CMUX_NUCLEO_FFI_LIB="$PWD/Native/CommandPaletteNucleoFFI/target/release/libcmux_command_palette_nucleo_ffi.dylib"
          # The zerocmux-unit scheme only runs the cmuxTests app-host suite; it does
          # not execute the SPM package test targets. Run them here so package
          # tests (settings stores, secret-file migration, socket-control
          # convergence, etc.) are a real CI gate, not just compiled.
          # Scoped to packages that build headlessly via SwiftPM (no GhosttyKit /
          # app-target dependency). Add a package here once its `swift test`
          # is confirmed to resolve standalone. The GhosttyKit-referencing
          # packages (CmuxTerminalCore and the terminal packages stacked on
          # it) are the exception: their binaryTarget only needs the
          # xcframework present at the repo root (downloaded earlier in this
          # job), and their test runners link a C stub for the @_silgen_name
          # symbol instead of the GhosttyKit archive.
          PACKAGES=(
            CmuxCanvasUI
            CmuxCore
            CmuxRemoteDaemon
            CmuxRemoteWorkspace
            CmuxRemoteSession
            CmuxBrowser
            CmuxCommandPalette
            CmuxControlSocket
            CmuxFoundation
            CmuxGit
            CmuxSettings
            CmuxSettingsUI
            CmuxTerminal
            CmuxTerminalCore
            CmuxUpdater
            CMUXAgentLaunch
          )
          # SwiftPM emits an error-severity diagnostic while planning the
          # GhosttyKit binaryTarget (the xcframework's static archive is not
          # lib-prefixed: "unexpected binary name"/"unexpected binary
          # framework"). The build and every test still succeed, but the
          # diagnostic poisons the process exit code on a fresh .build. For
          # the GhosttyKit-referencing packages only, tolerate exactly that
          # case: a nonzero exit passes only when the all-tests-passed summary
          # is present, no test failures are reported, and the only error
          # lines are that known diagnostic. Everything else (compile errors,
          # test failures, crashes) still fails the job.
          for pkg in "${PACKAGES[@]}"; do
            # Packages live under group folders (Packages/macOS/ in this fork);
            # resolve the actual directory so this list stays group-agnostic.
            pkgdir="$(find Packages -mindepth 2 -maxdepth 2 -type d -name "$pkg" -print -quit)"
            if [ -z "$pkgdir" ]; then
              echo "::error::package '$pkg' not found under Packages/*/ (renamed or moved?)"
              exit 1
            fi
            echo "::group::swift test $pkgdir"
            case "$pkg" in
            CmuxTerminal|CmuxTerminalCore)
              # Swift Testing can finish every assertion but leave its aggregate
              # runner alive when process-global terminal state spans suites.
              # Run one suite per process so state is torn down deterministically,
              # while retaining the narrow GhosttyKit diagnostic exception.
              CMUX_SWIFT_TEST_TOLERATE_GHOSTTY_BINARY_DIAGNOSTIC=1 \
                ./scripts/ci/run-swift-testing-suites.sh "$pkgdir"
              ;;
            CmuxRemoteWorkspace|CmuxRemoteSession)
              # The Remote* family is timing/subprocess-sensitive on 3-core
              # hosted runners: RemoteProxyBroker/RemoteCLIRelayServer fail
              # deterministically and CmuxRemoteSession's process-runner suite
              # can hang the job. All pass on real hardware. Bound the run and
              # retry once with the subprocess suite skipped.
              # perl alarm = portable timeout (GNU timeout is absent on the
              # hosted macOS images).
              bounded() { perl -e 'alarm shift @ARGV; exec @ARGV' "$@"; }
              bounded 300 swift test --package-path "$pkgdir" \
                --skip RemoteProxyBroker --skip RemoteCLIRelayServer \
              || bounded 300 swift test --package-path "$pkgdir" \
                --skip RemoteProxyBroker --skip RemoteCLIRelayServer \
                --skip RemoteSessionProcessRunner
              ;;
            *)
              # Blacksmith macOS runners intermittently abort a package's
              # test runner at startup (signal 5/6 immediately after "Build
              # complete!", zero test output). That is a runner flake, not a
              # test failure: retry exactly once, and only when no test
              # failures were reported.
              test_status=0
              output="$(swift test --package-path "$pkgdir" 2>&1)" || test_status=$?
              printf '%s\n' "$output"
              if [ "$test_status" -ne 0 ] \
                && printf '%s\n' "$output" | grep -q 'Exited with unexpected signal code' \
                && ! printf '%s\n' "$output" | grep -Eq 'with [1-9][0-9]* failures?'; then
                echo "Test runner crashed at startup (runner flake); retrying $pkg once."
                test_status=0
                output="$(swift test --package-path "$pkgdir" 2>&1)" || test_status=$?
                printf '%s\n' "$output"
              fi
              if [ "$test_status" -ne 0 ]; then
                exit "$test_status"
              fi
              ;;
            esac
            echo "::endgroup::"
          done

  agent-session-web-resources:
    needs: changes
    if: ${{ needs.changes.outputs.agent_session_web == 'true' }}
    runs-on: runs-on=${{ github.run_id }}-agent-session-web-resources/runner=4cpu-linux-x64/family=c7a+c7i+m7a+m7i/volume=100gb/spot=pco
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Build and test Agent Session web resources
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run agent-session-web:build
          bun run agent-session-web:test
          git diff --exit-code -- Resources/agent-session-react Resources/agent-session-solid

  linux-preflight:
    name: linux-preflight
    needs:
      - changes
      - workflow-guard-tests
      - remote-daemon-tests
      - react-apps-check
      - diff-sidecar-check
      - agent-session-web-resources
    if: ${{ always() }}
    runs-on: runs-on=${{ github.run_id }}-linux-preflight/runner=4cpu-linux-x64/family=c7a+c7i+m7a+m7i/volume=100gb/spot=pco
    timeout-minutes: 5
    steps:
      - name: Check cheap CI layer before macOS runners
        env:
          PREFLIGHT_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["PREFLIGHT_NEEDS"])
          required = ("changes", "workflow-guard-tests")
          allowed_routed = {
              "remote-daemon-tests",
              "react-apps-check",
              "diff-sidecar-check",
              "agent-session-web-resources",
          }

          bad = {}
          for name in required:
              result = needs[name]["result"]
              if result != "success":
                  bad[name] = result

          outputs = needs["changes"].get("outputs", {})
          routed_outputs = {
              "remote-daemon-tests": "go",
              "react-apps-check": "web",
              "diff-sidecar-check": "macos",
              "agent-session-web-resources": "agent_session_web",
          }
          for name in sorted(allowed_routed):
              result = needs[name]["result"]
              route = routed_outputs[name]
              if outputs.get(route) == "true":
                  if result != "success":
                      bad[name] = f"{result} (route {route}=true)"
              elif result not in {"success", "skipped"}:
                  bad[name] = result

          if bad:
              for name, result in bad.items():
                  print(f"{name}: {result}", file=sys.stderr)
              sys.exit(1)

          print(
              "routes: "
              f"macos={outputs.get('macos')} "
              f"web={outputs.get('web')} "
              f"go={outputs.get('go')} "
              f"agent_session_web={outputs.get('agent_session_web')}"
          )
          for name, data in sorted(needs.items()):
              print(f"{name}: {data['result']}")
          PY

  tests-build-and-lag:
    needs:
      - changes
      - linux-preflight
    # !cancelled() disables the implicit success() gate, which GitHub evaluates
    # over the transitive needs chain: linux-preflight runs behind routed linux
    # jobs that legitimately skip (web/go/agent-session paths), and that
    # transitive skip otherwise marks every macOS job skipped even when
    # linux-preflight itself succeeds. Require the direct needs explicitly.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.linux-preflight.result == 'success' && needs.changes.outputs.macos == 'true' }}
    # Build the full zerocmux scheme and run the lag regression on macOS CI.
    # Keep lag validation separate from UI regressions so functional UI failures
    # and performance regressions stay isolated. Broader interactive UI suites
    # still run via test-e2e.yml on isolated Tart runners.
    runs-on: tartelet
    # A cold DerivedData cache (any project.pbxproj or Package.resolved change
    # mints a new cache key with no restore-keys fallback) forces a full
    # zerocmux build whose Swift codegen alone can run 20+ min. Project/package
    # changes from the sidebar extension kit pushed this full build plus the
    # CA, lag, and UI regressions beyond 35 min before the cache could repopulate.
    timeout-minutes: 75
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh

      - name: Prepare isolated DerivedData
        run: |
          set -euo pipefail
          DERIVED_DATA_PATH="$RUNNER_TEMP/zerocmux-deriveddata-tests-build-and-lag"
          rm -rf "$DERIVED_DATA_PATH"
          mkdir -p "$DERIVED_DATA_PATH"
          echo "CMUX_DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> "$GITHUB_ENV"

      - name: Capture Ghostty revision
        id: ghostty-revision
        run: |
          echo "sha=$(git -C ghostty rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit.xcframework
        id: cache-ghosttykit-lag
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: GhosttyKit.xcframework
          key: ghosttykit-sentry-off-v1-${{ steps.ghostty-revision.outputs.sha }}

      - name: Download pre-built GhosttyKit.xcframework
        if: steps.cache-ghosttykit-lag.outputs.cache-hit != 'true'
        run: |
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Install zig
        run: |
          ./scripts/install-zig-ci.sh

      - name: Install Rust
        run: |
          ./scripts/install-rust-ci.sh

      - name: Cache Zig packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/zig
          key: zig-packages-${{ hashFiles('ghostty/build.zig.zon', 'ghostty/build.zig.zon.json') }}
          restore-keys: zig-packages-

      - name: Cache DerivedData
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/zerocmux-deriveddata-tests-build-and-lag
          key: deriveddata-build-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ hashFiles('cmux.xcodeproj/project.pbxproj') }}-${{ steps.ghostty-revision.outputs.sha }}

      - name: Cache Swift packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .ci-source-packages
          key: spm-build-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-build-

      - name: Sanitize Swift package cache
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .ci-source-packages

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          mkdir -p "$CMUX_DERIVED_DATA_PATH"
          mkdir -p "$SOURCE_PACKAGES_DIR"

          for attempt in 1 2 3; do
            if xcodebuild -project cmux.xcodeproj -scheme zerocmux -configuration Debug \
              -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -resolvePackageDependencies; then
              # Guard against a stale/poisoned Swift-package cache: a restored
              # .ci-source-packages can make resolve report success without the
              # binary artifacts (Sparkle) actually present, which then
              # fails the build. Verify they materialized; if not, clear and retry.
              if [ -d "$SOURCE_PACKAGES_DIR/artifacts/sparkle/Sparkle/Sparkle.xcframework" ]; then
                exit 0
              fi
              echo "Resolve succeeded but binary artifacts are missing (stale cache); clearing and retrying" >&2
              rm -rf "$SOURCE_PACKAGES_DIR"  # whole dir — resolve will not re-materialize artifacts into a partial tree
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to resolve Swift packages after 3 attempts" >&2
              exit 1
            fi
            echo "Package resolution failed on attempt $attempt, retrying..."
            sleep $((attempt * 5))
          done

      - name: Build for runtime regressions
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          xcodebuild -project cmux.xcodeproj -scheme zerocmux -configuration Debug \
            -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -destination "platform=macOS" build 2>&1 | tee /tmp/zerocmux-build-output.txt

      - name: Validate Swift warning budget
        run: python3 scripts/swift_warning_budget.py --log /tmp/zerocmux-build-output.txt

      - name: Create virtual display
        run: |
          set -euo pipefail
          HELPER_PATH="$RUNNER_TEMP/create-virtual-display"
          VDISPLAY_READY="$RUNNER_TEMP/zerocmux-build-lag-vdisplay.ready"
          VDISPLAY_ID_PATH="$RUNNER_TEMP/zerocmux-build-lag-vdisplay.id"
          VDISPLAY_LOG="$RUNNER_TEMP/zerocmux-build-lag-vdisplay.log"
          VDISPLAY_PID=""

          clang -framework Foundation -framework CoreGraphics \
            -o "$HELPER_PATH" scripts/create-virtual-display.m

          cleanup_display_attempt() {
            if [ -n "${VDISPLAY_PID:-}" ]; then
              kill "$VDISPLAY_PID" >/dev/null 2>&1 || true
              for _ in $(seq 1 50); do
                kill -0 "$VDISPLAY_PID" >/dev/null 2>&1 || break
                sleep 0.1
              done
              if kill -0 "$VDISPLAY_PID" >/dev/null 2>&1; then
                kill -9 "$VDISPLAY_PID" >/dev/null 2>&1 || true
                wait "$VDISPLAY_PID" >/dev/null 2>&1 || true
              fi
              VDISPLAY_PID=""
            fi
            scripts/ci/virtual-display-lock.sh reap-strays || true
            scripts/ci/virtual-display-lock.sh release || true
          }

          for attempt in 1 2 3; do
            rm -f "$VDISPLAY_READY" "$VDISPLAY_ID_PATH" "$VDISPLAY_LOG"
            LOCK_ENV="$(scripts/ci/virtual-display-lock.sh acquire)"
            eval "$LOCK_ENV"
            export CMUX_VDISPLAY_LOCK_DIR CMUX_VDISPLAY_LOCK_TOKEN
            {
              echo "CMUX_VDISPLAY_LOCK_DIR=$CMUX_VDISPLAY_LOCK_DIR"
              echo "CMUX_VDISPLAY_LOCK_TOKEN=$CMUX_VDISPLAY_LOCK_TOKEN"
            } >> "$GITHUB_ENV"

            # Now that we hold the lock, reap any leaked display helper so a
            # CGVirtualDisplay orphaned by a crashed/cancelled job cannot block
            # this create on persistent self-hosted runners.
            scripts/ci/virtual-display-lock.sh reap-strays || true

            "$HELPER_PATH" \
              --ready-path "$VDISPLAY_READY" \
              --display-id-path "$VDISPLAY_ID_PATH" \
              >"$VDISPLAY_LOG" 2>&1 &
            VDISPLAY_PID=$!
            scripts/ci/virtual-display-lock.sh set-owner "$VDISPLAY_PID"

            {
              echo "VDISPLAY_PID=$VDISPLAY_PID"
              echo "VDISPLAY_HELPER_PATH=$HELPER_PATH"
              echo "VDISPLAY_READY=$VDISPLAY_READY"
              echo "VDISPLAY_ID_PATH=$VDISPLAY_ID_PATH"
              echo "VDISPLAY_LOG=$VDISPLAY_LOG"
            } >> "$GITHUB_ENV"

            for _ in $(seq 1 100); do
              if [ -s "$VDISPLAY_READY" ] && [ -s "$VDISPLAY_ID_PATH" ]; then
                break
              fi
              if ! kill -0 "$VDISPLAY_PID" 2>/dev/null; then
                echo "Virtual display helper exited before readiness on attempt $attempt" >&2
                cat "$VDISPLAY_LOG" >&2 || true
                break
              fi
              sleep 0.1
            done

            if [ -s "$VDISPLAY_READY" ] && [ -s "$VDISPLAY_ID_PATH" ]; then
              echo "Virtual display ready: $(tr -d '\n' < "$VDISPLAY_ID_PATH")"
              cat "$VDISPLAY_LOG"
              exit 0
            fi

            echo "Virtual display not ready on attempt $attempt" >&2
            cat "$VDISPLAY_LOG" >&2 || true
            cleanup_display_attempt
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to create virtual display after 3 attempts" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Run CoreAnimation main-thread startup regression
        run: |
          set -euo pipefail
          APP="$(
            find "$CMUX_DERIVED_DATA_PATH" -path "*/Build/Products/Debug/zerocmux DEV.app" -exec stat -f '%m %N' {} \; \
              | sort -nr \
              | head -1 \
              | cut -d' ' -f2-
          )"
          if [ -z "${APP:-}" ] || [ ! -d "$APP" ]; then
            echo "zerocmux DEV.app not found in DerivedData" >&2
            exit 1
          fi

          CMUX_ALLOW_UNTAGGED_CA_REGRESSION=1 \
          CMUX_CA_ASSERT_HOLD_SECONDS=15 \
          CMUX_TAG="ci-ca-main-thread" \
          ./scripts/verify-main-thread-ca-transactions.sh "$APP"

      - name: Run workspace churn typing-lag regression
        run: |
          set -euo pipefail

          APP="$(find "$CMUX_DERIVED_DATA_PATH" -path "*/Build/Products/Debug/zerocmux DEV.app" -print -quit)"
          if [ -z "${APP:-}" ] || [ ! -d "$APP" ]; then
            echo "zerocmux DEV.app not found in DerivedData" >&2
            exit 1
          fi

          TAG="ci-lag"
          SOCK="/tmp/zerocmux-debug-${TAG}.sock"
          BUNDLE_ID="$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist" 2>/dev/null \
              || echo 'com.kernelalex.zerocmux.debug'
          )"

          pkill -x "zerocmux DEV" || true
          rm -f "$SOCK" "/tmp/zerocmux-${TAG}.sock" || true
          defaults write "$BUNDLE_ID" socketControlMode -string full >/dev/null 2>&1 || true

          CMUX_TAG="$TAG" CMUX_SOCKET_PATH="$SOCK" CMUX_UI_TEST_MODE=1 "$APP/Contents/MacOS/zerocmux DEV" >/tmp/zerocmux-ci-lag.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" >/dev/null 2>&1 || true' EXIT

          for _ in {1..240}; do
            [ -S "$SOCK" ] && break
            sleep 0.25
          done
          [ -S "$SOCK" ] || { echo "Socket not ready at $SOCK" >&2; exit 1; }

          CMUX_SOCKET_PATH="$SOCK" \
          CMUX_LAG_MAX_P95_RATIO=1.70 \
          CMUX_LAG_MAX_AVG_RATIO=1.70 \
          CMUX_LAG_MIN_BASELINE_P95_MS_FOR_RATIO=6.0 \
          CMUX_LAG_MIN_BASELINE_AVG_MS_FOR_RATIO=4.0 \
          CMUX_LAG_MAX_P95_DELTA_MS=20.0 \
          CMUX_LAG_MAX_AVG_DELTA_MS=12.0 \
          CMUX_LAG_MAX_CHURN_P95_MS=35 \
          CMUX_LAG_KEY_EVENTS=180 \
          python3 tests/test_workspace_churn_up_arrow_lag.py

      - name: Cleanup virtual display
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${VDISPLAY_PID:-}" ]; then
            kill "$VDISPLAY_PID" >/dev/null 2>&1 || true
            for _ in $(seq 1 50); do
              kill -0 "$VDISPLAY_PID" >/dev/null 2>&1 || break
              sleep 0.1
            done
            if kill -0 "$VDISPLAY_PID" >/dev/null 2>&1; then
              kill -9 "$VDISPLAY_PID" >/dev/null 2>&1 || true
              wait "$VDISPLAY_PID" >/dev/null 2>&1 || true
            fi
          fi
          scripts/ci/virtual-display-lock.sh reap-strays || true
          scripts/ci/virtual-display-lock.sh release || true
          rm -f "${VDISPLAY_HELPER_PATH:-}" "${VDISPLAY_READY:-}" "${VDISPLAY_ID_PATH:-}" "${VDISPLAY_LOG:-}"

  release-build:
    needs:
      - changes
      - linux-preflight
      - swift-package-tests
    # See app-host-unit-tests: explicit direct-needs gate instead of the
    # implicit success() so skipped routed linux jobs upstream of
    # linux-preflight do not skip this job transitively.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.linux-preflight.result == 'success' && needs.swift-package-tests.result == 'success' && needs.changes.outputs.macos == 'true' }}
    # Compile the same unsigned universal Release app that nightly builds before
    # signing, notarization, and publishing. This catches DEBUG/Release boundary
    # mistakes before they reach main.
    # Keep the app build on macOS 26 so SDK-gated SwiftUI Liquid Glass code
    # compiles into the same artifact shape as nightly and stable releases.
    # Release builds need enough disk for a universal Release build plus the
    # restored SwiftPM cache. Use a clean, ephemeral Tart VM.
    runs-on: tartelet
    timeout-minutes: 60
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh

      - name: Compute Xcode compilation cache key
        id: compilation-cache-key
        run: |
          set -euo pipefail
          echo "toolchain=$(xcodebuild -version | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Capture Ghostty revision
        id: ghostty-revision
        run: |
          echo "sha=$(git -C ghostty rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reclaim release runner disk
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          rm -rf build-universal .spm-cache
          echo "Disk after cleanup:"
          df -h /

      - name: Cache GhosttyKit.xcframework
        id: cache-ghosttykit-release
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: GhosttyKit.xcframework
          key: ghosttykit-sentry-off-v1-${{ steps.ghostty-revision.outputs.sha }}

      - name: Download pre-built GhosttyKit.xcframework
        if: steps.cache-ghosttykit-release.outputs.cache-hit != 'true'
        run: |
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Install Rust
        run: |
          ./scripts/install-rust-ci.sh

      - name: Cache DerivedData
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            build-universal
            !build-universal/CompilationCache.noindex
          key: deriveddata-release-v2-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ hashFiles('cmux.xcodeproj/project.pbxproj') }}-${{ steps.ghostty-revision.outputs.sha }}

      - name: Cache Xcode compilation results
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: build-universal/CompilationCache.noindex
          key: xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            xcode-compilation-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.compilation-cache-key.outputs.toolchain }}-

      - name: Cache Swift packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .spm-cache
          key: spm-release-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-release-
            spm-

      - name: Sanitize Swift package cache
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .spm-cache

      - name: Build universal app (Release)
        run: |
          set -euo pipefail
          CMUX_SKIP_ZIG_BUILD=1 xcodebuild -project cmux.xcodeproj -scheme zerocmux -configuration Release -derivedDataPath build-universal \
            -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_LIMIT_SIZE=3221225472 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon-Nightly build

      - name: Validate Release updater repository
        run: |
          set -euo pipefail
          APP_PLIST="build-universal/Build/Products/Release/zerocmux.app/Contents/Info.plist"
          EXPECTED_FEED_URL="https://github.com/Enigma-Labs-Technology/zerocmux/releases/latest/download/appcast.xml"
          ACTUAL_FEED_URL="$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$APP_PLIST")"
          if [ "$ACTUAL_FEED_URL" != "$EXPECTED_FEED_URL" ]; then
            echo "Release SUFeedURL expected '$EXPECTED_FEED_URL', found '$ACTUAL_FEED_URL'" >&2
            exit 1
          fi

      - name: Bound Xcode compilation cache size
        run: |
          set -euo pipefail
          cache_path="build-universal/CompilationCache.noindex"
          max_cache_kib=$((5 * 1024 * 1024))
          if [ -d "$cache_path" ]; then
            cache_kib=$(du -sk "$cache_path" | awk '{print $1}')
          else
            cache_kib=0
          fi
          echo "Xcode compilation cache size: ${cache_kib} KiB (limit: ${max_cache_kib} KiB)"
          if [ "$cache_kib" -gt "$max_cache_kib" ]; then
            echo "Xcode compilation cache exceeds 5 GiB; skipping cache save"
            rm -rf "$cache_path"
          fi

      - name: Download universal Ghostty CLI helper
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: zerocmux-ghostty-cli-helper
          path: ghostty-cli-helper

      - name: Install universal Ghostty CLI helper
        run: |
          set -euo pipefail
          ./scripts/install-prebuilt-ghostty-cli-helper.sh \
            ghostty-cli-helper/ghostty \
            build-universal/Build/Products/Release/zerocmux.app

      - name: Validate Release artifact slices
        run: |
          set -euo pipefail
          APP_BINARY="build-universal/Build/Products/Release/zerocmux.app/Contents/MacOS/zerocmux"
          CLI_BINARY="build-universal/Build/Products/Release/zerocmux.app/Contents/Resources/bin/zerocmux"
          HELPER_BINARY="build-universal/Build/Products/Release/zerocmux.app/Contents/Resources/bin/ghostty"
          DIFF_SIDECAR="build-universal/Build/Products/Release/zerocmux.app/Contents/Resources/bin/cmux-diff-sidecar"
          test -x "$APP_BINARY"
          test -x "$CLI_BINARY"
          test -x "$HELPER_BINARY"
          test -x "$DIFF_SIDECAR"
          file "$APP_BINARY" "$CLI_BINARY" "$HELPER_BINARY" "$DIFF_SIDECAR"
          SDK_VERSION="$(otool -l "$APP_BINARY" | awk '/LC_BUILD_VERSION/ { in_version=1; next } in_version && /sdk / { print $2; exit }')"
          echo "App SDK version: $SDK_VERSION"
          lipo "$APP_BINARY" -verify_arch arm64 x86_64
          lipo "$CLI_BINARY" -verify_arch arm64 x86_64
          lipo "$HELPER_BINARY" -verify_arch arm64 x86_64
          ./scripts/verify-diff-sidecar-artifact.sh "$DIFF_SIDECAR"
          [[ "$SDK_VERSION" == 26.* ]]

  ui-regressions:
    needs: changes
    if: ${{ needs.changes.outputs.macos == 'true' }}
    runs-on: tartelet
    # Cold builds after project/package changes can spend more than 25 minutes
    # in build-for-testing before the UI regression script starts.
    timeout-minutes: 45
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh

      - name: Prepare isolated DerivedData
        run: |
          set -euo pipefail
          DERIVED_DATA_PATH="$RUNNER_TEMP/zerocmux-deriveddata-ui-regressions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$DERIVED_DATA_PATH"
          echo "CMUX_DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> "$GITHUB_ENV"

      - name: Download pre-built GhosttyKit.xcframework
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Install zig
        run: |
          ./scripts/install-zig-ci.sh

      - name: Install Rust
        run: |
          ./scripts/install-rust-ci.sh

      - name: Cache Zig packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/zig
          key: zig-packages-${{ hashFiles('ghostty/build.zig.zon', 'ghostty/build.zig.zon.json') }}
          restore-keys: zig-packages-

      - name: Cache Swift packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .ci-source-packages
          key: spm-ui-regressions-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-ui-regressions-

      - name: Sanitize Swift package cache
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .ci-source-packages

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          rm -rf "$CMUX_DERIVED_DATA_PATH"
          mkdir -p "$SOURCE_PACKAGES_DIR"

          for attempt in 1 2 3; do
            if xcodebuild -project cmux.xcodeproj -scheme zerocmux -configuration Debug \
              -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -resolvePackageDependencies; then
              # Guard against a stale/poisoned Swift-package cache: a restored
              # .ci-source-packages can make resolve report success without the
              # binary artifacts (Sparkle) actually present, which then
              # fails the build. Verify they materialized; if not, clear and retry.
              if [ -d "$SOURCE_PACKAGES_DIR/artifacts/sparkle/Sparkle/Sparkle.xcframework" ]; then
                exit 0
              fi
              echo "Resolve succeeded but binary artifacts are missing (stale cache); clearing and retrying" >&2
              rm -rf "$SOURCE_PACKAGES_DIR"  # whole dir — resolve will not re-materialize artifacts into a partial tree
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to resolve Swift packages after 3 attempts" >&2
              exit 1
            fi
            echo "Package resolution failed on attempt $attempt, retrying..."
            sleep $((attempt * 5))
          done

      - name: Build for testing (display resolution)
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          xcodebuild -project cmux.xcodeproj -scheme zerocmux -configuration Debug \
            -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -destination "platform=macOS" \
            build-for-testing

      - name: Enable XCTest automation mode
        run: scripts/ci/enable-xctest-automation-mode.sh

      - name: Run display resolution churn UI regression
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          TOKEN="$(uuidgen)"
          HELPER_PATH="$RUNNER_TEMP/create-virtual-display-display-churn-${TOKEN}"
          DIAG_PATH="/tmp/zerocmux-ui-test-display-churn-${TOKEN}.json"
          DISPLAY_READY="/tmp/zerocmux-ui-test-display-${TOKEN}.ready"
          DISPLAY_ID_PATH="/tmp/zerocmux-ui-test-display-${TOKEN}.id"
          DISPLAY_START="/tmp/zerocmux-ui-test-display-${TOKEN}.start"
          DISPLAY_DONE="/tmp/zerocmux-ui-test-display-${TOKEN}.done"
          HELPER_LOG="/tmp/zerocmux-ui-test-display-${TOKEN}-helper.log"
          XCODEBUILD_LOG="/tmp/zerocmux-ui-test-display-${TOKEN}-xcodebuild.log"
          BASELINE_READY_MARKER="CMUX_DISPLAY_CHURN_BASELINE_READY_${TOKEN}"
          HELPER_PID=""
          START_SIGNAL_PID=""
          DISPLAY_LOCK_DIR=""
          DISPLAY_LOCK_TOKEN=""

          acquire_display_lock() {
            LOCK_ENV="$(scripts/ci/virtual-display-lock.sh acquire)"
            eval "$LOCK_ENV"
            export CMUX_VDISPLAY_LOCK_DIR CMUX_VDISPLAY_LOCK_TOKEN
            DISPLAY_LOCK_DIR="$CMUX_VDISPLAY_LOCK_DIR"
            DISPLAY_LOCK_TOKEN="$CMUX_VDISPLAY_LOCK_TOKEN"
          }

          release_display_lock() {
            if [ -n "${DISPLAY_LOCK_DIR:-}" ]; then
              CMUX_VDISPLAY_LOCK_DIR="$DISPLAY_LOCK_DIR" \
              CMUX_VDISPLAY_LOCK_TOKEN="$DISPLAY_LOCK_TOKEN" \
                scripts/ci/virtual-display-lock.sh release || true
              DISPLAY_LOCK_DIR=""
              DISPLAY_LOCK_TOKEN=""
            fi
          }

          cleanup_attempt() {
            if [ -n "${START_SIGNAL_PID:-}" ]; then
              kill "$START_SIGNAL_PID" 2>/dev/null || true
              wait "$START_SIGNAL_PID" 2>/dev/null || true
              START_SIGNAL_PID=""
            fi
            if [ -n "${HELPER_PID:-}" ]; then
              kill "$HELPER_PID" 2>/dev/null || true
              wait "$HELPER_PID" 2>/dev/null || true
              HELPER_PID=""
            fi
            release_display_lock
            pkill -x "zerocmux DEV" 2>/dev/null || true
            rm -f "$DIAG_PATH" "$DISPLAY_READY" "$DISPLAY_ID_PATH" "$DISPLAY_START" "$DISPLAY_DONE" "$HELPER_LOG" "$XCODEBUILD_LOG"
            rm -f /tmp/zerocmux-ui-test-prelaunch.json /tmp/zerocmux-ui-test-display-harness.json
          }

          cleanup() {
            cleanup_attempt
            rm -f "$HELPER_PATH"
          }
          trap cleanup EXIT

          # Build display helper
          clang -framework Foundation -framework CoreGraphics \
            -o "$HELPER_PATH" scripts/create-virtual-display.m

          # Find the app binary
          APP_BINARY=$(find "$CMUX_DERIVED_DATA_PATH" -path "*/Build/Products/Debug/zerocmux DEV.app/Contents/MacOS/zerocmux DEV" -print -quit 2>/dev/null || true)
          if [ -z "$APP_BINARY" ]; then
            echo "ERROR: App binary not found in DerivedData" >&2
            exit 1
          fi
          echo "App binary: $APP_BINARY"

          for attempt in 1 2; do
            cleanup_attempt 2>/dev/null || true

            acquire_display_lock

            # Reap any leaked display helper now that we hold the lock, so a
            # CGVirtualDisplay orphaned by a crashed/cancelled job cannot block
            # this create on persistent self-hosted runners.
            scripts/ci/virtual-display-lock.sh reap-strays || true

            # Launch display helper from shell (non-sandboxed). The helper waits
            # on a shell-owned /tmp start file; XCTest prints a baseline-ready
            # marker after sampling render stats, then the shell writes startPath.
            "$HELPER_PATH" \
              --modes "1920x1080,1728x1117,1600x900,1440x810" \
              --ready-path "$DISPLAY_READY" \
              --display-id-path "$DISPLAY_ID_PATH" \
              --start-path "$DISPLAY_START" \
              --done-path "$DISPLAY_DONE" \
              --iterations 40 \
              --interval-ms 40 \
              > "$HELPER_LOG" 2>&1 &
            HELPER_PID=$!
            scripts/ci/virtual-display-lock.sh set-owner "$HELPER_PID"

            # Wait for display ready
            echo "Waiting for virtual display..."
            DISPLAY_READY_OK=false
            for _ in $(seq 1 100); do
              if [ -s "$DISPLAY_READY" ] && [ -s "$DISPLAY_ID_PATH" ]; then
                DISPLAY_READY_OK=true
                break
              fi
              if ! kill -0 "$HELPER_PID" 2>/dev/null; then
                echo "ERROR: Virtual display helper exited before readiness" >&2
                cat "$HELPER_LOG" 2>/dev/null || true
                break
              fi
              sleep 0.1
            done
            if [ "$DISPLAY_READY_OK" != "true" ]; then
              echo "ERROR: Virtual display not ready after 10s" >&2
              cat "$HELPER_LOG" 2>/dev/null || true
              cleanup_attempt
              if [ "$attempt" -eq 2 ]; then
                echo "Display resolution UI regression failed after 2 virtual display setup attempts" >&2
                exit 1
              fi
              sleep 3
              continue
            fi
            DISPLAY_ID=$(tr -d '\n' < "$DISPLAY_ID_PATH")
            echo "Virtual display ready: ID=$DISPLAY_ID"

            # Launch app from shell (non-sandboxed, outside XCTest sandbox)
            CMUX_UI_TEST_MODE=1 \
            CMUX_UI_TEST_DIAGNOSTICS_PATH="$DIAG_PATH" \
            CMUX_UI_TEST_DISPLAY_RENDER_STATS=1 \
            CMUX_UI_TEST_TARGET_DISPLAY_ID="$DISPLAY_ID" \
            CMUX_TAG="ui-tests-display-resolution" \
            "$APP_BINARY" > /tmp/zerocmux-ui-test-app.log 2>&1 &
            APP_PID=$!
            echo "App launched: PID=$APP_PID"

            # Wait for app diagnostics
            echo "Waiting for app diagnostics..."
            APP_READY=false
            for i in $(seq 1 30); do
              if [ -f "$DIAG_PATH" ]; then
                if python3 -c "import json; d=json.load(open('$DIAG_PATH')); assert d.get('pid')" 2>/dev/null; then
                  APP_READY=true
                  break
                fi
              fi
              if ! kill -0 "$APP_PID" 2>/dev/null; then
                echo "ERROR: App crashed during startup"
                cat /tmp/zerocmux-ui-test-app.log 2>/dev/null | tail -30 || true
                break
              fi
              sleep 0.5
            done

            if [ "$APP_READY" != "true" ]; then
              echo "Attempt $attempt: App not ready after 15s"
              pkill -x "zerocmux DEV" 2>/dev/null || true
              kill "$HELPER_PID" 2>/dev/null || true
              if [ "$attempt" -eq 2 ]; then
                echo "Display resolution UI regression failed after 2 attempts" >&2
                echo "--- App log ---"
                cat /tmp/zerocmux-ui-test-app.log 2>/dev/null | tail -50 || true
                echo "--- Helper log ---"
                cat "$HELPER_LOG" 2>/dev/null | tail -20 || true
                echo "--- Diagnostics ---"
                cat "$DIAG_PATH" 2>/dev/null || echo "(not found)"
                exit 1
              fi
              sleep 3
              continue
            fi

            echo "App started. Diagnostics:"
            cat "$DIAG_PATH"

            # Wait for render stats (terminal surface initialization)
            echo "Waiting for render stats..."
            RENDER_READY=false
            for i in $(seq 1 40); do
              if python3 -c "import json; d=json.load(open('$DIAG_PATH')); assert d.get('renderStatsAvailable') == '1'" 2>/dev/null; then
                RENDER_READY=true
                echo "Render stats available after $((i / 2))s"
                break
              fi
              sleep 0.5
            done
            if [ "$RENDER_READY" != "true" ]; then
              echo "WARNING: Render stats not available after 20s. Diagnostics:"
              cat "$DIAG_PATH" 2>/dev/null || true
              echo "--- App log ---"
              cat /tmp/zerocmux-ui-test-app.log 2>/dev/null | tail -30 || true
            fi

            # Write manifests so test can find the pre-launched state
            MANIFEST_PATH="/tmp/zerocmux-ui-test-display-harness.json"
            cat >"$MANIFEST_PATH" <<MANIFEST_EOF
          {"readyPath":"$DISPLAY_READY","displayIDPath":"$DISPLAY_ID_PATH","startPath":"$DISPLAY_START","donePath":"$DISPLAY_DONE","logPath":"$HELPER_LOG"}
          MANIFEST_EOF

            PRELAUNCH_PATH="/tmp/zerocmux-ui-test-prelaunch.json"
            cat >"$PRELAUNCH_PATH" <<PRELAUNCH_EOF
          {"diagnosticsPath":"$DIAG_PATH","baselineReadyMarker":"$BASELINE_READY_MARKER"}
          PRELAUNCH_EOF

            # Run test — app is already launched from shell
            (
              for _ in $(seq 1 480); do
                if grep -Fq "$BASELINE_READY_MARKER" "$XCODEBUILD_LOG" 2>/dev/null; then
                  echo "XCTest baseline marker observed; starting display churn"
                  printf 'start\n' > "$DISPLAY_START"
                  exit 0
                fi
                sleep 0.25
              done
              echo "ERROR: XCTest baseline marker not observed before display-churn start timeout" >&2
              echo "--- xcodebuild log tail ---" >&2
              tail -80 "$XCODEBUILD_LOG" >&2 2>/dev/null || true
              echo "--- diagnostics ---" >&2
              cat "$DIAG_PATH" >&2 2>/dev/null || true
              exit 1
            ) &
            START_SIGNAL_PID=$!

            XCODEBUILD_OK=false
            if xcodebuild -project cmux.xcodeproj -scheme zerocmux -configuration Debug \
              -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -disableAutomaticPackageResolution \
              -destination "platform=macOS" \
              -only-testing:cmuxUITests/DisplayResolutionRegressionUITests \
              test-without-building 2>&1 | tee "$XCODEBUILD_LOG"; then
              XCODEBUILD_OK=true
            fi

            if [ -n "${START_SIGNAL_PID:-}" ]; then
              kill "$START_SIGNAL_PID" 2>/dev/null || true
              wait "$START_SIGNAL_PID" 2>/dev/null || true
              START_SIGNAL_PID=""
            fi

            if [ "$XCODEBUILD_OK" = "true" ]; then
              cleanup_attempt
              exit 0
            fi

            pkill -x "zerocmux DEV" 2>/dev/null || true
            cleanup_attempt

            if [ "$attempt" -eq 2 ]; then
              echo "Display resolution UI regression failed after 2 attempts" >&2
              exit 1
            fi
            echo "Attempt $attempt failed, retrying..."
            sleep 3
          done

      - name: Create persistent virtual display
        run: |
          set -euo pipefail
          LOCK_ENV="$(scripts/ci/virtual-display-lock.sh acquire)"
          eval "$LOCK_ENV"
          export CMUX_VDISPLAY_LOCK_DIR CMUX_VDISPLAY_LOCK_TOKEN
          {
            echo "CMUX_VDISPLAY_LOCK_DIR=$CMUX_VDISPLAY_LOCK_DIR"
            echo "CMUX_VDISPLAY_LOCK_TOKEN=$CMUX_VDISPLAY_LOCK_TOKEN"
          } >> "$GITHUB_ENV"

          HELPER_PATH="$RUNNER_TEMP/create-virtual-display-persistent"
          clang -framework Foundation -framework CoreGraphics \
            -o "$HELPER_PATH" scripts/create-virtual-display.m

          VDISPLAY_READY="$RUNNER_TEMP/zerocmux-vdisplay-persistent.ready"
          VDISPLAY_ID_PATH="$RUNNER_TEMP/zerocmux-vdisplay-persistent.id"
          VDISPLAY_LOG="$RUNNER_TEMP/zerocmux-vdisplay-persistent.log"
          rm -f "$VDISPLAY_READY" "$VDISPLAY_ID_PATH" "$VDISPLAY_LOG"

          # Now that we hold the lock, reap any leaked display helper so a
          # CGVirtualDisplay orphaned by a crashed/cancelled job cannot block
          # this create on persistent self-hosted runners.
          scripts/ci/virtual-display-lock.sh reap-strays || true

          "$HELPER_PATH" \
            --modes "1920x1080" \
            --ready-path "$VDISPLAY_READY" \
            --display-id-path "$VDISPLAY_ID_PATH" \
            >"$VDISPLAY_LOG" 2>&1 &
          VDISPLAY_PERSISTENT_PID=$!
          scripts/ci/virtual-display-lock.sh set-owner "$VDISPLAY_PERSISTENT_PID"

          {
            echo "VDISPLAY_PERSISTENT_PID=$VDISPLAY_PERSISTENT_PID"
            echo "VDISPLAY_PERSISTENT_HELPER_PATH=$HELPER_PATH"
            echo "VDISPLAY_PERSISTENT_READY=$VDISPLAY_READY"
            echo "VDISPLAY_PERSISTENT_ID_PATH=$VDISPLAY_ID_PATH"
            echo "VDISPLAY_PERSISTENT_LOG=$VDISPLAY_LOG"
          } >> "$GITHUB_ENV"

          echo "Waiting for persistent virtual display..."
          for _ in $(seq 1 100); do
            if [ -s "$VDISPLAY_READY" ] && [ -s "$VDISPLAY_ID_PATH" ]; then
              break
            fi
            if ! kill -0 "$VDISPLAY_PERSISTENT_PID" 2>/dev/null; then
              echo "Persistent virtual display helper exited before readiness" >&2
              cat "$VDISPLAY_LOG" >&2 || true
              exit 1
            fi
            sleep 0.1
          done

          if [ ! -s "$VDISPLAY_READY" ] || [ ! -s "$VDISPLAY_ID_PATH" ]; then
            echo "ERROR: Persistent virtual display not ready after 10s" >&2
            cat "$VDISPLAY_LOG" >&2 || true
            exit 1
          fi

          echo "Persistent virtual display ready: ID=$(tr -d '\n' < "$VDISPLAY_ID_PATH")"
          cat "$VDISPLAY_LOG"

      - name: Run browser find focus UI regression
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          if [ -n "${VDISPLAY_PERSISTENT_PID:-}" ] && ! kill -0 "$VDISPLAY_PERSISTENT_PID" 2>/dev/null; then
            echo "Persistent virtual display exited before browser find UI regression" >&2
            cat "${VDISPLAY_PERSISTENT_LOG:-/dev/null}" >&2 || true
            exit 1
          fi

          xcodebuild -project cmux.xcodeproj -scheme zerocmux -configuration Debug \
            -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -destination "platform=macOS" \
            -maximum-test-execution-time-allowance 180 \
            -only-testing:cmuxUITests/BrowserPaneNavigationKeybindUITests/testCmdFOpensBrowserFindAfterCmdDCmdLNavigation \
            test-without-building

      - name: Cleanup persistent virtual display
        if: always()
        run: |
          if [ -n "${VDISPLAY_PERSISTENT_PID:-}" ]; then
            kill "$VDISPLAY_PERSISTENT_PID" >/dev/null 2>&1 || true
            for _ in $(seq 1 50); do
              kill -0 "$VDISPLAY_PERSISTENT_PID" >/dev/null 2>&1 || break
              sleep 0.1
            done
          fi
          scripts/ci/virtual-display-lock.sh release || true
          rm -f "${VDISPLAY_PERSISTENT_HELPER_PATH:-}" "${VDISPLAY_PERSISTENT_READY:-}" "${VDISPLAY_PERSISTENT_ID_PATH:-}" "${VDISPLAY_PERSISTENT_LOG:-}"

  ci-status:
    needs:
      - changes
      - workflow-guard-tests
      - remote-daemon-tests
      - react-apps-check
      - diff-sidecar-check
      - linux-preflight
      - app-host-unit-tests
      - tests
      - swift-package-tests
      - agent-session-web-resources
      - tests-build-and-lag
      - release-build
      - ui-regressions
    if: ${{ always() }}
    runs-on: runs-on=${{ github.run_id }}-ci-status/runner=4cpu-linux-x64/family=c7a+c7i+m7a+m7i/volume=100gb/spot=pco
    steps:
      - name: Check routed CI jobs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["CI_NEEDS"])
          allowed = {"success", "skipped"}
          bad = {
              name: data["result"]
              for name, data in sorted(needs.items())
              if data["result"] not in allowed
          }

          if bad:
              for name, result in bad.items():
                  print(f"{name}: {result}", file=sys.stderr)
              sys.exit(1)

          for name, data in sorted(needs.items()):
              print(f"{name}: {data['result']}")
          PY
