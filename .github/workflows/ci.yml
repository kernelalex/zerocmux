name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: runs-on=${{ github.run_id }}-changes/runner=4cpu-linux-x64/family=c7a+c7i+m7a+m7i/volume=100gb/spot=pco
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.detect.outputs.macos }}
      web: ${{ steps.detect.outputs.web }}
      go: ${{ steps.detect.outputs.go }}
      agent_session_web: ${{ steps.detect.outputs.agent_session_web }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Detect CI change areas
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          emit_all_areas() {
            {
              echo "macos=true"
              echo "web=true"
              echo "go=true"
              echo "agent_session_web=true"
            } >> "$GITHUB_OUTPUT"
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Checkout depth 2 contains the synthetic merge commit and its
            # base parent, even when base/head histories are shallow boundaries.
            if ! git diff --name-only "$BASE_SHA" "$MERGE_SHA" > /tmp/zerocmux-ci-changed-files.txt; then
              echo "Could not compute PR diff; running all CI areas." >&2
              emit_all_areas
              exit 0
            fi

            if [ ! -s /tmp/zerocmux-ci-changed-files.txt ]; then
              echo "PR diff is empty; running all CI areas."
              emit_all_areas
              exit 0
            fi

            # This guard lives in workflow YAML, before the PR-editable detector
            # runs. Router/workflow edits must fail open even if a PR breaks the
            # detector's own self-change classification.
            if grep -Eq '^(\.github/workflows/ci\.yml|scripts/ci/[^/]+\.py|tests/test_ci_change_areas\.py)$' /tmp/zerocmux-ci-changed-files.txt; then
              echo "CI router changed; running all CI areas."
              emit_all_areas
              exit 0
            fi

            python3 scripts/ci/detect_ci_change_areas.py \
              --event-name "$EVENT_NAME" \
              --files-from /tmp/zerocmux-ci-changed-files.txt
            exit 0
          fi

          python3 scripts/ci/detect_ci_change_areas.py \
            --event-name "$EVENT_NAME" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

  workflow-guard-tests:
    runs-on: tartelet
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install modern bash (PS0 preexec needs bash >= 4.4)
        run: |
          if ! command -v bash >/dev/null || [ "$(bash -c 'echo ${BASH_VERSINFO[0]}')" -lt 4 ]; then
            brew install bash
          fi
          bash --version | head -1

      - name: Validate macOS runner guards
        run: ./tests/test_ci_self_hosted_guard.sh

      - name: Validate release SDK build lane
        run: ./tests/test_ci_release_sdk_lane.sh

      - name: Validate Python test harness syntax
        run: git ls-files 'tests/*.py' 'tests_v2/*.py' 'scripts/*.py' | xargs python3 -m py_compile

      - name: Validate Claude launch environment policy generation
        run: python3 scripts/generate-claude-launch-environment-policy.py --check

      - name: Set up Bun for Claude launch environment policy test
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.6"

      - name: Validate Claude launch environment policy behavior
        working-directory: agent-chat
        run: bun test/claude-environment.test.ts

      - name: Set up Python 3.9 for nightly prune compatibility
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.9"

      - name: Install workflow guard Python dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3 bashlex==0.18

      - name: Validate nightly prune Python compatibility
        run: PYTHON_BIN=python3.9 bash ./tests/test_ci_nightly_prune_python_compat.sh

      - name: Validate activation benchmark scrollback sizing
        run: python3 tests/test_perf_activation_scrollback_sizing.py

      - name: Validate create-dmg version pinning
        run: ./tests/test_ci_create_dmg_pinned.sh

      - name: Validate app bundle license compliance
        run: ./tests/test_app_bundle_license_compliance.sh

      - name: Validate unit-test SwiftPM retry guard
        run: ./tests/test_ci_unit_test_spm_retry.sh

      - name: Validate Swift Testing suite timeout guard
        run: python3 tests/test_swift_testing_suite_timeout.py

      - name: Validate xcodebuild noninteractive crash prompt guard
        run: python3 tests/test_ci_xcodebuild_noninteractive_helper.py

      - name: Validate XCTest summary tolerance gate
        run: python3 tests/test_ci_xctest_summary_gate.py

      - name: Validate app-host xcodebuild retry guard
        run: ./tests/test_ci_app_host_xcodebuild_retry.sh

      - name: Validate app-host xcodebuild attempt budget
        run: ./tests/test_ci_app_host_xcodebuild_attempts.sh

      - name: Validate app-host Swift test count guard
        run: ./tests/test_ci_app_host_xcodebuild_test_count.sh

      - name: Validate zerocmux profiling support scripts
        run: ./tests/test_start_cmux_profiling.sh

      - name: Validate Xcode SourcePackages cache sanitizer
        run: python3 tests/test_ci_sanitize_xcode_source_packages_cache.py

      - name: Validate zerocmux scheme test configuration
        run: ./tests/test_ci_scheme_testaction_debug.sh

      - name: Validate cmuxTests sharding
        run: |
          python3 scripts/ci/cmux_unit_test_shard.py --validate
          python3 tests/test_ci_cmux_unit_test_shard.py

      - name: Validate GhosttyKit checksum verification
        run: ./tests/test_ci_ghosttykit_checksum_verification.sh

      - name: Validate Zig install without sudo
        run: ./tests/test_install_zig_ci_no_sudo.sh

      - name: Initialize Ghostty for Zig version guard
        run: git submodule update --init --depth 1 ghostty

      - name: Validate Ghostty Zig version synchronization
        run: ./tests/test_ghostty_zig_version_sync.sh

      - name: Validate virtual display lock
        run: ./tests/test_ci_virtual_display_lock.sh

      - name: Validate nightly tag push auth
        run: ./tests/test_ci_nightly_tag_push_auth.sh

      - name: Validate nightly Xcode selection
        run: ./tests/test_ci_nightly_xcode_selection.sh

      - name: Validate CI Xcode selection fast path
        run: ./tests/test_ci_xcode_selection_fast_path.sh

      - name: Validate universal nightly workflow
        run: bash ./tests/test_nightly_universal_build.sh

      - name: Validate release secret normalization
        run: ./tests/test_ci_release_secret_normalization.sh

      - name: Validate release artifact secret scanner
        run: ./tests/test_ci_release_artifact_secret_scan.sh

      - name: Validate Sparkle secret handling
        run: ./tests/test_ci_sparkle_secret_handling.sh

      - name: Validate entitlement key mutation guards
        run: ./tests/test_ci_entitlements_literal_key_mutation.sh

      - name: Validate release asset guard
        run: node scripts/release_asset_guard.test.js

      - name: Validate CI change area filter
        run: python3 tests/test_ci_change_areas.py

      - name: Validate release attestation retry guard
        run: ./tests/test_ci_attestation_retry.sh

      - name: Validate Python R2 appcast upload guard
        run: ./tests/test_ci_r2_upload_python.sh

      - name: Validate release-build timeout guard
        run: ./tests/test_ci_release_build_timeout.sh

      - name: Validate markdown viewer asset compression
        run: ./tests/test_compress_markdown_viewer_assets.sh

      - name: Validate release bundle stripping
        run: ./tests/test_strip_release_bundle.sh

      - name: Validate current GhosttyKit checksum pin
        run: ./tests/test_ci_ghosttykit_checksum_present.sh

      - name: Validate Swift warning budget guard
        run: ./tests/test_ci_swift_warning_budget.sh

      - name: Validate auxiliary window close shortcut lint
        run: ./tests/test_ci_auxiliary_window_close_shortcuts.sh

      - name: Validate pbxproj test-wiring lint
        run: ./tests/test_ci_pbxproj_test_wiring.sh

      - name: Validate stored DispatchWorkItem ownership
        run: |
          python3 tests/test_lint_stored_dispatch_work_items.py
          python3 scripts/lint-stored-dispatch-work-items.py

      - name: Validate pbxproj objectVersion pin and normalization
        run: ./scripts/check-pbxproj.sh

      - name: Validate workspace SPM package grouping
        run: python3 scripts/check-workspace-package-groups.py --check

      - name: Validate SwiftPM lockfile policy
        run: python3 scripts/check-package-resolved-policy.py

      - name: Validate bash shell integration job control
        run: python3 tests/test_bash_integration_no_done_notifications.py

      - name: Validate sidebar lazy-layout guard
        run: python3 tests/test_ci_sidebar_lazy_layout_guard.py

      - name: Validate bash prompt bootstrap composes with user PROMPT_COMMAND (starship)
        run: python3 tests/test_issue_5164_starship_prompt_composition.py

      - name: Validate test determinism gate
        run: python3 scripts/check-test-determinism.py --strict

  remote-daemon-tests:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: runs-on=${{ github.run_id }}-remote-daemon-tests/runner=4cpu-linux-x64/family=c7a+c7i+m7a+m7i/volume=100gb/spot=pco
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: daemon/remote/go.mod
          cache-dependency-path: daemon/remote/go.sum

      - name: Run remote daemon tests
        working-directory: daemon/remote
        run: go test ./...

      - name: Validate remote daemon release assets
        run: ./tests/test_remote_daemon_release_assets.sh

  # Checks for in-app React webviews (currently the diff viewer; more zerocmux
  # React surfaces will live alongside it).
  react-apps-check:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: runs-on=${{ github.run_id }}-react-apps-check/runner=4cpu-linux-x64/family=c7a+c7i+m7a+m7i/volume=100gb/spot=pco
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Verify generated webviews assets
        run: ./scripts/build-webviews-app.sh --check

      - name: Verify React Compiler for webviews
        run: ./scripts/check-webviews-react-compiler.mjs

      - name: Typecheck webviews
        working-directory: webviews
        run: bun run typecheck

      - name: Test webviews
        working-directory: webviews
        run: bun run test

      - name: Oxlint webviews
        working-directory: webviews
        run: bun run lint:ci

      - name: React Doctor
        working-directory: webviews
        run: bun run react-doctor:ci

  diff-sidecar-check:
    needs: changes
    # Generated protocol and streaming benchmarks also cover webview-only diffs.
    if: ${{ needs.changes.outputs.macos == 'true' || needs.changes.outputs.web == 'true' }}
    runs-on: runs-on=${{ github.run_id }}-diff-sidecar-check/runner=4cpu-linux-x64/family=c7a+c7i+m7a+m7i/volume=100gb/spot=pco
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        run: ./scripts/install-rust-ci.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install webview dependencies
        working-directory: webviews
        run: bun install --frozen-lockfile

      - name: Check Rust sidecar
        run: |
          ./scripts/run-diff-sidecar-cargo.sh fmt --manifest-path Native/DiffSidecar/Cargo.toml --all --check
          ./scripts/run-diff-sidecar-cargo.sh clippy --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --locked --no-default-features -- -D warnings
          ./scripts/run-diff-sidecar-cargo.sh clippy --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --all-features --locked -- -D warnings
          ./scripts/run-diff-sidecar-cargo.sh test --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --locked --no-default-features
          ./scripts/run-diff-sidecar-cargo.sh test --manifest-path Native/DiffSidecar/Cargo.toml --all-targets --all-features --locked

      - name: Verify generated protocol types
        run: ./scripts/generate-diff-sidecar-types.sh --check

      - name: Enforce diff-viewer performance budgets
        env:
          CMUX_DIFF_WEB_BENCH_ITERATIONS: "10"
        run: ./scripts/benchmark-diff-viewer.sh

  app-host-unit-tests:
    needs:
      - changes
      - linux-preflight
    # !cancelled() disables the implicit success() gate, which GitHub evaluates
    # over the transitive needs chain: linux-preflight runs behind routed linux
    # jobs that legitimately skip (web/go/agent-session paths), and that
    # transitive skip otherwise marks every macOS job skipped even when
    # linux-preflight itself succeeds. Require the direct needs explicitly.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.linux-preflight.result == 'success' && needs.changes.outputs.macos == 'true' }}
    name: app-host unit tests (${{ matrix.shard }}/4)
    # App-host XCTest needs a clean, ephemeral Tart VM with an Aqua session
    # that can broker testmanagerd control sessions.
    runs-on: tartelet
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CMUX_CI_XCODE_APP: ${{ vars.CMUX_CI_XCODE_APP_MACOS_26 }}
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      CMUX_SKIP_ZIG_BUILD: "1"
      # Keep one-off focused gates on the lightest measured shard so shard 1 no
      # longer carries the full shard plus every extra regression guard.
      CMUX_APP_HOST_FOCUSED_REGRESSION_SHARD: "4"
      # XCTest app-host crashes can leave xcodebuild waiting in Swift's crash
      # backtracer until the job timeout. Keep crash handling non-interactive
      # and cheap so xcodebuild can restart/finish the suite.
      SWIFT_BACKTRACE: "interactive=no,timeout=0s,symbolicate=off,color=no"
      CMUX_XCODEBUILD_NONINTERACTIVE_POST_TEST_TIMEOUT_SECONDS: "45"
    steps:
      - name: Clear stale git locks (self-hosted reused workspace)
        shell: bash
        run: |
          # Self-hosted macOS runners reuse the workspace. A job cancelled or
          # killed mid-checkout can leave a stale .git/modules/*/index.lock that
          # fails every later submodule checkout (e.g. ghostty). Clear them first.
          ws="${GITHUB_WORKSPACE:-$PWD}"
          rm -f "$ws/.git/index.lock" 2>/dev/null || true
          if [ -d "$ws/.git/modules" ]; then
            find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          ./scripts/select-ci-xcode.sh

      - name: Capture Ghostty revision
        id: ghostty-revision
        run: |
          echo "sha=$(git -C ghostty rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit.xcframework
        id: cache-ghosttykit
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: GhosttyKit.xcframework
          key: ghosttykit-sentry-off-v1-${{ steps.ghostty-revision.outputs.sha }}

      - name: Download pre-built GhosttyKit.xcframework
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: |
          ./scripts/download-prebuilt-ghosttykit.sh

      - name: Install Rust
        run: |
          ./scripts/install-rust-ci.sh

      - name: Cache Swift packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .ci-source-packages
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Sanitize Swift package cache
        run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .ci-source-packages

      - name: Prepare isolated DerivedData
        run: |
          set -euo pipefail
          DERIVED_DATA_PATH="${RUNNER_TEMP}/zerocmux-derived-data-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-shard-${{ matrix.shard }}"
          rm -rf "$DERIVED_DATA_PATH"
          mkdir -p "$DERIVED_DATA_PATH"
          echo "CMUX_DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          mkdir -p "$SOURCE_PACKAGES_DIR"

          for attempt in 1 2 3; do
            if xcodebuild -project cmux.xcodeproj -scheme zerocmux-unit -configuration Debug \
              -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -resolvePackageDependencies; then
              # Guard against a stale/poisoned Swift-package cache: a restored
              # .ci-source-packages can make resolve report success without the
              # binary artifacts (Sparkle) actually present, which then
              # fails the build. Verify they materialized; if not, clear and retry.
              if [ -d "$SOURCE_PACKAGES_DIR/artifacts/sparkle/Sparkle/Sparkle.xcframework" ]; then
                exit 0
              fi
              echo "Resolve succeeded but binary artifacts are missing (stale cache); clearing and retrying" >&2
              rm -rf "$SOURCE_PACKAGES_DIR"  # whole dir — resolve will not re-materialize artifacts into a partial tree
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to resolve Swift packages after 3 attempts" >&2
              exit 1
            fi
            echo "Package resolution failed on attempt $attempt, retrying..."
            sleep $((attempt * 5))
          done

      - name: Run Ghostty split-theme appearance regression
        if: ${{ matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_SHARD) }}
        run: |
          set -euo pipefail
          DERIVED_DATA_PATH="${RUNNER_TEMP:-/tmp}/zerocmux-terminal-core-split-theme"
          rm -rf "$DERIVED_DATA_PATH"
          (
            cd Packages/macOS/CmuxTerminalCore
            xcodebuild \
              -scheme CmuxTerminalCore-Package \
              -destination "platform=macOS" \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              build-for-testing
          )
          xcrun xctest "$DERIVED_DATA_PATH/Build/Products/Debug/CmuxTerminalCoreTests.xctest"

      - name: Enable XCTest automation mode
        run: scripts/ci/enable-xctest-automation-mode.sh

      - name: Run agent chat transcript lifecycle regressions
        if: ${{ matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_SHARD) }}
        run: |
          # Swift Testing assertion failures are tolerated in the full sharded
          # app-host suite. Keep hook-driven transcript resolution on a
          # non-tolerant focused invocation so Feed ingress cannot regain an
          # unbounded recursive filesystem scan.
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          for suite in \
            AgentChatSessionRegistryLifecycleReviewRegressionTests \
            AgentChatFallbackTranscriptResolutionCoordinatorTests
          do
            scripts/ci/run-in-console-session.sh \
              scripts/ci/run-app-host-xcodebuild.sh \
              -project cmux.xcodeproj -scheme zerocmux-unit -configuration Debug \
              -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -disableAutomaticPackageResolution \
              -destination "platform=macOS" \
              CMUX_SKIP_ZIG_BUILD=1 \
              -only-testing:"cmuxTests/$suite" \
              test
          done

      - name: Run browser runtime viewport regression
        if: ${{ matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_SHARD) }}
        run: |
          # The tolerant full-suite step can accept ordinary assertion failures
          # when XCTest reports "0 unexpected". Keep the real-WKWebView DOM
          # viewport check non-tolerant so a layout-only screenshot workaround
          # cannot make this regression appear green.
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          scripts/ci/run-in-console-session.sh \
            scripts/ci/run-app-host-xcodebuild.sh \
            -project cmux.xcodeproj -scheme zerocmux-unit -configuration Debug \
            -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -destination "platform=macOS" \
            CMUX_SKIP_ZIG_BUILD=1 \
            -only-testing:cmuxTests/BrowserViewportRuntimeTests \
            test

      - name: Run five-tab renderer memory regression
        if: ${{ matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_SHARD) }}
        run: |
          # Use a dedicated app-host process so task_vm_info deltas only compare
          # one versus five real Ghostty renderers in this workload. The focused
          # invocation also makes footprint assertion failures non-tolerant.
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          CMUX_RENDERER_MEMORY_REGRESSION=1 \
            scripts/ci/run-in-console-session.sh \
            scripts/ci/run-app-host-xcodebuild.sh \
            -project cmux.xcodeproj -scheme zerocmux-unit -configuration Debug \
            -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -destination "platform=macOS" \
            CMUX_SKIP_ZIG_BUILD=1 \
            -only-testing:cmuxTests/GhosttySurfaceOverlayTests/testFiveTabRendererFootprintReturnsToOneRendererTargetAcrossHideRevealCycles \
            test

      - name: Run notification routing regressions
        if: ${{ matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_SHARD) }}
        run: |
          # The tolerant full-suite step can accept assertion failures or stop
          # after an app-host crash before this suite runs. Keep notification
          # move/clear causality coverage on a non-tolerant focused invocation.
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          scripts/ci/run-in-console-session.sh \
            scripts/ci/run-app-host-xcodebuild.sh \
            -project cmux.xcodeproj -scheme zerocmux-unit -configuration Debug \
            -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -destination "platform=macOS" \
            CMUX_SKIP_ZIG_BUILD=1 \
            -only-testing:cmuxTests/AgentNotificationRegressionTests \
            -only-testing:cmuxTests/DockNotificationAttentionTests \
            -only-testing:cmuxTests/ClaudeHookLifecycleCleanupTests \
            -only-testing:cmuxTests/ClaudeHookLiveDeliveryTargetTests \
            -only-testing:cmuxTests/ClaudeHookPIDAuthenticationTests \
            -only-testing:cmuxTests/HostSettingsShortcutNotificationTests \
            test

      - name: Run Pi Feed ownership regressions
        if: ${{ matrix.shard == fromJSON(env.CMUX_APP_HOST_FOCUSED_REGRESSION_SHARD) }}
        run: |
          # Swift Testing assertion failures are tolerated in the full sharded
          # app-host suite. Keep Feed ingestion and ownership on a non-tolerant
          # focused invocation so valid Pi Feed targets cannot silently regress.
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          # Each suite mutates process-global app/store state. Give every suite
          # a fresh app-host process so Swift Testing cannot interleave them.
          for suite in \
            FeedCoordinatorTests \
            FeedCoordinatorIngressTests \
            PiFeedOwnershipTests \
            PiFeedDockOwnershipTests
          do
